<header class="topnav">
  <div class="topnav-inner">
    {% if page.layout == "doc" %}
    <button class="nav-toggle" aria-label="Toggle navigation">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    {% endif %}

    <a class="topnav-brand" href="{{ '/' | relative_url }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M4 14a4 4 0 0 1 4-4h8a4 4 0 0 1 0 8H8a4 4 0 0 1-4-4Z"/><path d="M12 10V6"/></svg>
      freundcloud
    </a>

    <nav class="topnav-links" aria-label="Primary">
      <a href="{{ '/about/' | relative_url }}"><span class="nav-link-text">About</span></a>
      <a href="{{ '/work/' | relative_url }}"><span class="nav-link-text">Work</span></a>
      <a href="{{ '/cv/' | relative_url }}"><span class="nav-link-text">CV</span></a>
      <a href="{{ '/kb/' | relative_url }}"><span class="nav-link-text">Knowledge Base</span></a>
      <a href="https://github.com/{{ site.github_username }}" rel="noopener"><span class="nav-link-text">GitHub</span></a>
      <button class="icon-btn" data-search-open aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle colour theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </nav>
  </div>
</header>
