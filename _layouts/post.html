---
layout: base
---

<section class="section">
  <article class="prose post">
    <a class="post-back" href="{{ '/blog/' | relative_url }}">← all posts</a>
    <h1 class="mt-0">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {%- if page.tags and page.tags.size > 0 %} ·
        {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
      {%- endif %}
    </p>

    {{ content }}

    <hr class="post-rule">
    <p class="text-muted">
      Written by {{ site.author }} ·
      <a href="{{ site.linkedin_url }}" rel="noopener">LinkedIn</a> ·
      <a href="https://github.com/{{ site.github_username }}" rel="noopener">GitHub</a>
    </p>
  </article>
  {% include giscus.html %}
</section>
